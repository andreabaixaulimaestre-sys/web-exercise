<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 09</title>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 360px;
        }

        .box {
            font-size: 24px;
            font-weight: bold;
            color: #000000;
            padding: 8px 12px;
            margin: 0;
        }

        /* 1. Fondo azul claro con doble borde rojo/naranja (double border) */
        .box-1 {
            background-color: #aedae6;
            border: 4px double #e74c3c;
        }

        /* 2. Fondo amarillo con borde sólido azul redondeado (rounded border) */
        .box-2 {
            background-color: #ffff00;
            border: 2px solid #007bff;
            border-radius: 8px;
        }

        /* 3. Fondo verde con borde punteado gris (dotted border) */
        .box-3 {
            background-color: #48bb78;
            border: 4px dotted #718096;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="box box-1">Hello World</div>
        <div class="box box-2">Hello World</div>
        <div class="box box-3">Hello World</div>
    </div>

</body>
</html>
